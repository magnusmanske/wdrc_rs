[package]
name = "wdrc_rs"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1"
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
# A single gzip-enabled client is reused for all API calls; see src/wikidata_api.rs
reqwest = { version = "0.13", features = ["json", "gzip", "query"] }
toolforge = { version = "6.1", features = ["wikipool"] }
# `TimeStamp`, and `telemetry` for the Buggregator service dashboard (git only, not on
# crates.io); the API client lives in src/wikidata_api.rs.
wikimisc = { git = "https://github.com/magnusmanske/wikimisc", features = ["date", "telemetry"] }

[profile.release]
opt-level = 3
lto = 'fat'
panic = 'abort'
codegen-units = 1
