[package]
name = "wdrc_rs"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
# A single gzip-enabled client (built by `wikimisc::http`) is reused for all API calls;
# see src/wikidata_api.rs
reqwest = { version = "0.13", features = ["json", "gzip", "query"] }
toolforge = { version = "6.1", features = ["wikipool"] }
# `TimeStamp`, entity IDs, the HTTP client setup, logging, `telemetry` for the
# Buggregator service dashboard, and for the web service: axum glue (`server`),
# HTML escaping and the SPARQL client (git only, not on crates.io).
wikimisc = { git = "https://github.com/magnusmanske/wikimisc", features = ["date", "entity-id", "escape", "http", "logging", "server", "sparql-client", "telemetry"] }

[dev-dependencies]
# Calls the axum router directly in the web service tests.
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 3
lto = 'fat'
panic = 'abort'
codegen-units = 1
